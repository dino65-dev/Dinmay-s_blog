name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes (adjust as needed)
    # Format: minute hour day month day-of-week
    - cron: '*/10 * * * *'
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend API
        run: |
          echo "======================================"
          echo "Pinging backend at $(date)"
          echo "======================================"
          
          # First ping attempt
          if curl -f -s -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s\n" \
            https://dinmay-blog-backend.onrender.com/api/; then
            echo "✅ Backend is awake and responding!"
          else
            echo "⚠️  First ping failed, backend might be waking up..."
            echo "Waiting 30 seconds and retrying..."
            sleep 30
            
            # Retry after 30 seconds
            if curl -f -s -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s\n" \
              https://dinmay-blog-backend.onrender.com/api/; then
              echo "✅ Backend woke up successfully!"
            else
              echo "❌ Backend did not respond after 30s"
              exit 1
            fi
          fi
          
      - name: Ping Complete
        run: |
          echo "======================================"
          echo "✅ Keep-alive ping completed at $(date)"
          echo "Next ping in 10 minutes"
          echo "======================================"
