version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dinmay-blog-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=dinmay_blog

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dinmay-blog-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=dinmay_blog
      - CORS_ORIGINS=http://localhost:3000
      - SECRET_KEY=change-this-in-production
      - ADMIN_PASSWORD=admin123
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dinmay-blog-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:
